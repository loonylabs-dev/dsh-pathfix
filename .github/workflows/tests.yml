# Automated unit and E2E tests for dsh-pathfix on every push and pull request.
#
# Validates:
# - Pure normalizer unit tests (5 observed tool error signatures)
# - Guarantees: No-Op reference equality and Idempotency
# - Regex pattern preservation (preserving edge spaces/tabs)
# - Cordis pipeline waterfall integration
# - Live E2E tests against @deepseek-ai/dsh-tool-fs implementations
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run test suite
        run: npm test
